# ขั้นที่ 4: เติมข้อมูลย้อนหลัง (กดรันเองจากแท็บ Actions)
name: backfill

on:
  workflow_dispatch:
    inputs:
      station_days:
        description: 'จำนวนวันย้อนหลังของสถานี (ThaiWater)'
        default: '7'
      dam_days:
        description: 'จำนวนวันย้อนหลังของเขื่อน (กรมชลฯ)'
        default: '30'
      rid_days:
        description: 'จำนวนวันย้อนหลังของสถานีกรมชลฯ รายชั่วโมง (0 = ไม่ดึง, สูงสุด 90)'
        default: '0'

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: เติมข้อมูลย้อนหลัง
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          STATION_DAYS: ${{ inputs.station_days }}
          DAM_DAYS: ${{ inputs.dam_days }}
          RID_DAYS: ${{ inputs.rid_days }}
        run: node ingest/backfill.mjs "$STATION_DAYS" "$DAM_DAYS" "$RID_DAYS"
