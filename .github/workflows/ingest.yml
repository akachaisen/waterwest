# ดึงข้อมูลน้ำแล้วบันทึกลง Supabase ด้วย Node — กดรันเองจากแท็บ Actions เท่านั้น
# (ตัวตั้งเวลาหลักคือ Supabase Cron → Edge Function ingest · ปิดการรันตามเวลาตั้งแต่ 5 ต.ค. 2569
#  เพราะรันซ้ำซ้อนและทำให้รอบของ Supabase ถูกข้าม — ถ้า Supabase หยุด watchdog.yml จะแจ้งผู้ดูแล)
# ต้องตั้ง Secrets ใน GitHub: SUPABASE_URL, SUPABASE_SECRET_KEY
name: ingest

on:
  workflow_dispatch: {}

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: ดึงข้อมูลและบันทึก
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node ingest/snapshot.mjs --quiet
      - name: สรุปผลในหน้า Actions
        if: always()
        run: test -f data/latest.md && cat data/latest.md >> "$GITHUB_STEP_SUMMARY" || true
