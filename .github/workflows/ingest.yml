# ขั้นที่ 2: ดึงข้อมูลน้ำทุก 15 นาที แล้วบันทึกลง Supabase
# ต้องตั้ง Secrets ใน GitHub: SUPABASE_URL, SUPABASE_SECRET_KEY
name: ingest

on:
  schedule:
    - cron: '7,22,37,52 * * * *'   # ทุก 15 นาที เลี่ยงนาที :00/:15 ที่ GitHub หนาแน่น (อาจเลื่อนได้บ้าง)
  workflow_dispatch: {}      # กดรันเองได้จากแท็บ Actions

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: ดึงข้อมูลและบันทึก
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node ingest/snapshot.mjs --quiet
      - name: สรุปผลในหน้า Actions
        if: always()
        run: test -f data/latest.md && cat data/latest.md >> "$GITHUB_STEP_SUMMARY" || true
